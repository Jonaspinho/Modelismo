<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Porão</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e9eef2; --panel:#f7f9fb; --ink:#14213d; --muted:#56637e; --line:#c9d3de; --accent:#2b4bff; --accent-ink:#fff;
  --head:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Instrument Sans","Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1624;--panel:#18223a;--ink:#e8edf7;--muted:#9aa8c4;--line:#2b3957;--accent:#7f95ff;--accent-ink:#0f1624;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0f1624;--panel:#18223a;--ink:#e8edf7;--muted:#9aa8c4;--line:#2b3957;--accent:#7f95ff;--accent-ink:#0f1624;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{padding:28px clamp(16px,4vw,48px) 8px}
h1{font:800 clamp(2rem,5vw,3.4rem)/1 var(--head);margin:0;letter-spacing:-.02em}
header p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.layout{display:grid;grid-template-columns:270px 1fr;gap:28px;padding:20px clamp(16px,4vw,48px) 48px;align-items:start}
aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
aside h2{font:700 1.05rem var(--head);margin:0 0 12px}
fieldset{border:0;padding:0;margin:0 0 18px}
legend{font:600 .9rem var(--body);padding:0;margin-bottom:8px}
label.chk{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:.95rem}
label.chk input{accent-color:var(--accent);width:16px;height:16px}
label.chk .n{margin-left:auto;color:var(--muted);font-size:.8rem}
input[type=search],select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
button,.btn{font:600 .9rem var(--body);cursor:pointer;border-radius:8px;padding:9px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;display:inline-block}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.toggle{display:none;width:100%;margin-bottom:12px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:4px 10px;font-size:.8rem}
#count{font:700 1.1rem var(--head)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;padding:0;text-align:left;color:inherit;font:inherit;width:100%}
.card:hover{border-color:var(--accent)}
.poster{position:relative;overflow:hidden;aspect-ratio:2/3;padding:14px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;background:linear-gradient(160deg,var(--c1),var(--c2))}
.poster b{font:800 1.5rem/1.05 var(--head);letter-spacing:-.01em;overflow-wrap:anywhere}
.poster span{font:500 .8rem var(--body);opacity:.9}
.poster iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;background:#fff}
.poster .score,.poster .t{position:relative;z-index:1}
.poster.hascover .t{display:none}
.score{align-self:flex-end;background:rgba(0,0,0,.55);border-radius:6px;padding:2px 8px;font:700 .95rem var(--head)}
.info{padding:12px 14px 14px;font-size:.88rem}
.info h3{font:700 1rem var(--head);margin:0}
.info p{margin:2px 0 0;color:var(--muted)}
#sentinel{height:1px}
#more{text-align:center;color:var(--muted);font-size:.85rem;margin:20px 0 0}
.scroll{max-height:220px;overflow-y:auto;overscroll-behavior:contain;padding:0 6px 0 0;margin-right:-6px;border-radius:6px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;
  background:
    linear-gradient(var(--panel) 30%,transparent) center top,
    linear-gradient(transparent,var(--panel) 70%) center bottom,
    radial-gradient(farthest-side at 50% 0,rgba(0,0,0,.22),transparent) center top,
    radial-gradient(farthest-side at 50% 100%,rgba(0,0,0,.22),transparent) center bottom;
  background-repeat:no-repeat;background-size:100% 26px,100% 26px,100% 9px,100% 9px;
  background-attachment:local,local,scroll,scroll}
.scroll::-webkit-scrollbar,aside::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-track,aside::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb,aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}
.scroll::-webkit-scrollbar-thumb:hover,aside::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
.banner-wrap{display:flex;justify-content:center;margin:0 0 18px}
.banner-wrap[hidden]{display:none}
.banner{position:relative;width:100%;max-width:2061px;aspect-ratio:2061/763;overflow:hidden;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.banner iframe{position:absolute;top:0;left:0;width:2061px;height:763px;border:0;transform-origin:0 0;background:#fff}
.empty{grid-column:1/-1;padding:40px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:12px}
.reader{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.reader[hidden]{display:none}
.rbar{display:flex;align-items:center;gap:12px;padding:10px clamp(12px,3vw,28px);border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.rbar strong{font:800 1.2rem var(--head)}
.rbar .meta{color:var(--muted);font-size:.85rem;flex:1;min-width:140px}
.rframe{flex:1;border:0;width:100%;background:#fff}
.rnote{margin:0;padding:8px clamp(12px,3vw,28px);font-size:.85rem;color:var(--muted);border-top:1px solid var(--line)}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  aside{position:static;display:none;max-height:none;overflow:visible}
  aside.open{display:block}
  .toggle{display:block}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8655690012436378"
     crossorigin="anonymous"></script>
</head>
<body>
<header>
  <h1>O Porão</h1>
  <p>Filtre por categoria, país e década. Clique em uma revista para ler o PDF.</p>
</header>

<div class="layout">
  <div class="side-wrap">
    <button class="toggle" id="toggle" aria-expanded="false" aria-controls="filters">Mostrar filtros</button>
    <aside id="filters" aria-label="Filtros">
      <h2>Filtros</h2>
      <fieldset>
        <legend>Buscar</legend>
        <input type="search" id="q" placeholder="Título da revista" aria-label="Buscar por título">
      </fieldset>
      <fieldset id="series"><legend>Revista</legend></fieldset>
      <fieldset id="genres"><legend>Categoria</legend></fieldset>
      <fieldset>
        <legend>País</legend>
        <select id="country" aria-label="País"></select>
      </fieldset>
      <fieldset>
        <legend>Década</legend>
        <select id="decade" aria-label="Década"></select>
      </fieldset>
      <fieldset>
        <legend>Ordenar por</legend>
        <select id="sort" aria-label="Ordenar por">
          <option value="pub">Publicação mais recente</option>
          <option value="year-desc">Ano mais recente</option>
          <option value="year-asc">Ano mais antigo</option>
          <option value="title">Título (A–Z)</option>
        </select>
      </fieldset>
      <button id="clear">Limpar filtros</button>
    </aside>
  </div>

  <main>
  <div class="banner-wrap" id="banner" hidden>
    <div class="banner" id="bannerBox" role="complementary" aria-label="Publicidade">
      <iframe id="bannerFrame" title="Banner" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation" referrerpolicy="no-referrer" scrolling="no" width="728" height="90"></iframe>
    </div>
  </div>
    <div class="bar">
      <span id="count" aria-live="polite"></span>
      <div class="chips" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div id="sentinel" aria-hidden="true"></div>
    <p id="more" role="status"></p>
  </main>
</div>

<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="rTitle">
  <div class="rbar">
    <strong id="rTitle"></strong>
    <span class="meta" id="rMeta"></span>
    <a class="btn primary" id="rDownload" target="_blank" rel="noopener noreferrer" download>Baixar PDF</a>
    <a class="btn" id="rOpen" target="_blank" rel="noopener noreferrer">Abrir em nova aba</a>
    <button id="rClose">Fechar</button>
  </div>
  <iframe class="rframe" id="rFrame" title="Leitor de PDF"></iframe>
  <p class="rnote" id="rNote">Se o PDF não aparecer aqui, use “Abrir em nova aba”: alguns sites não permitem exibição dentro de outra página.</p>
</div>

<script>
const $=id=>document.getElementById(id);
let films=[];
const state={series:new Set(),genres:new Set(),decade:"",country:"",q:"",sort:"pub"};

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[];let row=[],cur="",inQ=false;
  text=text.replace(/^\uFEFF/,"");
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else inQ=false }
      else cur+=c;
    }else if(c==='"') inQ=true;
    else if(c===","){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){
      if(c==="\r"&&text[i+1]==="\n")i++;
      row.push(cur);cur="";
      if(row.some(v=>v.trim()!==""))rows.push(row);
      row=[];
    }else cur+=c;
  }
  row.push(cur);
  if(row.some(v=>v.trim()!==""))rows.push(row);
  return rows;
}
function hue(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h%360}
function safeUrl(u){u=(u||"").trim();return /^(https?:\/\/|[^:\s]+$)/i.test(u)?u:""}
function toFilms(text){
  const rows=parseCSV(text);
  if(rows.length<2)throw new Error("O CSV está vazio.");
  const head=rows[0].map(h=>h.trim().toLowerCase());
  if(!head.includes("titulo"))throw new Error("O CSV precisa ter a coluna “titulo”.");
  return rows.slice(1).map(r=>{
    const o={};head.forEach((h,i)=>o[h]=(r[i]||"").trim());
    const serie=(o.revista||o.titulo.replace(/\s*#\s*\d+\s*$|\s+(?:n[º°o]\.?\s*)?\d+\s*$/i,"")).trim()||o.titulo;
    const h=hue(serie);
    return{
      title:o.titulo,series:serie,year:parseInt(o.ano,10)||0,country:o.pais||"—",
      code:(o.sigla||o.pais||"").slice(0,3).toUpperCase(),
      genres:(o.categorias||"").split(";").map(s=>s.trim()).filter(Boolean),
      pub:parseDate(o.data_publicacao),pubKey:parseKey(o.data_publicacao),cover:safeUrl(o.capa_url),pdf:safeUrl(o.pdf_url),dl:safeUrl(o.download_url),
      c1:`hsl(${h} 60% 42%)`,c2:`hsl(${h} 65% 14%)`
    };
  });
}

/* ---------- Interface ---------- */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
/* Aceita data ou data com hora (AAAA-MM-DD, AAAA-MM-DD HH:MM:SS, AAAA-MM-DDTHH:MM,
   DD/MM/AAAA, DD/MM/AAAA HH:MM...). Guarda só a data em AAAA-MM-DD; a hora é ignorada. */
function parseDate(v){
  v=(v||"").trim();if(!v)return "";
  const p=n=>String(n).padStart(2,"0");
  let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m)return `${m[1]}-${p(m[2])}-${p(m[3])}`;
  m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/);
  if(m)return `${m[3]}-${p(m[2])}-${p(m[1])}`;
  const t=new Date(v);
  return isNaN(t)?"":`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;
}
/* Chave de ordenação com hora: AAAA-MM-DDTHH:MM:SS (sem hora informada = 00:00:00). */
function parseKey(v){
  const d=parseDate(v);if(!d)return "";
  const m=String(v).match(/[T\s](\d{1,2}):(\d{2})(?::(\d{2}))?/);
  const p=n=>String(n).padStart(2,"0");
  return m?`${d}T${p(m[1])}:${m[2]}:${p(m[3]||0)}`:`${d}T00:00:00`;
}
const fmt=d=>d?d.split("-").reverse().join("/"):"—";

function buildFilters(){
  const checks=(box,legend,set,values,countOf)=>{
    box.innerHTML=`<legend>${legend}</legend><div class="scroll" tabindex="0" role="group" aria-label="${legend}"></div>`;
    const list=box.querySelector(".scroll");
    values.forEach(name=>{
      const l=document.createElement("label");l.className="chk";
      l.innerHTML=`<input type="checkbox" value="${esc(name)}"><span>${esc(name)}</span><span class="n">${countOf(name)}</span>`;
      l.querySelector("input").addEventListener("change",e=>{e.target.checked?set.add(name):set.delete(name);render()});
      list.appendChild(l);
    });
  };
  const sort=a=>[...new Set(a)].sort((x,y)=>x.localeCompare(y,"pt-BR"));
  checks($("series"),"Revista",state.series,sort(films.map(f=>f.series)),n=>films.filter(f=>f.series===n).length);
  checks($("genres"),"Categoria",state.genres,sort(films.flatMap(f=>f.genres)),n=>films.filter(f=>f.genres.includes(n)).length);
  const opt=(sel,items,all)=>{sel.innerHTML=`<option value="">${all}</option>`+items.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join("")};
  opt($("country"),[...new Set(films.map(f=>f.country))].sort((a,b)=>a.localeCompare(b,"pt-BR")).map(c=>[c,c]),"Todos");
  opt($("decade"),[...new Set(films.filter(f=>f.year).map(f=>Math.floor(f.year/10)*10))].sort((a,b)=>b-a).map(d=>[d,`Anos ${d}`]),"Todas");
}
function reset(){
  state.series.clear();state.genres.clear();state.decade="";state.country="";state.q="";state.sort="pub";
  document.querySelectorAll("#series input,#genres input").forEach(i=>i.checked=false);
  $("decade").value="";$("country").value="";$("q").value="";$("sort").value="pub";
  render();
}
function render(){
  let list=films.map((f,i)=>({...f,i})).filter(f=>
    (!state.series.size||state.series.has(f.series))&&
    (!state.genres.size||[...state.genres].some(g=>f.genres.includes(g)))&&
    (!state.decade||Math.floor(f.year/10)*10==state.decade)&&
    (!state.country||f.country===state.country)&&
    (!state.q||f.title.toLowerCase().includes(state.q))
  );
  const s=state.sort;
  list.sort((a,b)=>s==="pub"?(b.pubKey.localeCompare(a.pubKey)||a.title.localeCompare(b.title,"pt-BR")):s==="year-desc"?b.year-a.year:s==="year-asc"?a.year-b.year:a.title.localeCompare(b.title,"pt-BR"));
  $("count").textContent=list.length===1?"1 revista":`${list.length} revistas`;

  const chips=$("chips");chips.innerHTML="";
  const add=(label,fn)=>{const b=document.createElement("button");b.className="chip";b.textContent=label+" ×";b.setAttribute("aria-label","Remover filtro "+label);b.onclick=fn;chips.appendChild(b)};
  state.series.forEach(n=>add(n,()=>{state.series.delete(n);document.querySelectorAll("#series input").forEach(i=>{if(i.value===n)i.checked=false});render()}));
  state.genres.forEach(g=>add(g,()=>{state.genres.delete(g);document.querySelectorAll("#genres input").forEach(i=>{if(i.value===g)i.checked=false});render()}));
  if(state.decade)add(`Anos ${state.decade}`,()=>{state.decade="";$("decade").value="";render()});
  if(state.country)add(state.country,()=>{state.country="";$("country").value="";render()});

  current=list;shown=0;$("grid").innerHTML="";
  if(list.length)showMore();
  else{
    $("grid").innerHTML=`<div class="empty"><strong>Nenhuma revista encontrada.</strong><p>Remova um filtro para ver mais revistas.</p><button class="primary" onclick="reset()">Limpar filtros</button></div>`;
    updateStatus();
  }
}

/* ---------- Carregamento sob demanda (rolagem) ---------- */
const PAGE=window.IntersectionObserver?12:1e6;
let current=[],shown=0;
const cardHtml=f=>`
    <button class="card" data-i="${f.i}" aria-label="Ler ${esc(f.title)}">
      <div class="poster${f.cover?" hascover":""}" style="--c1:${f.c1};--c2:${f.c2}">
        ${f.cover?`<iframe src="${esc(f.cover)}" title="" tabindex="-1" scrolling="no" loading="lazy"></iframe>`:""}
        <span class="score">${esc(f.code)}</span>
        <div class="t"><b>${esc(f.title)}</b><span>${f.year||"—"}</span></div>
      </div>
      <div class="info">
        <h3>${esc(f.title)}</h3>
        <p>${esc(f.genres.join(", "))}</p>
        <p>${esc(f.country)} · ${f.year||"—"}</p>
        <p>Publicação: ${fmt(f.pub)}</p>
      </div>
    </button>`;
function updateStatus(){
  const m=$("more");
  m.textContent=!current.length?"":shown<current.length?`Mostrando ${shown} de ${current.length}. Role para carregar mais.`:current.length>PAGE?`Todas as ${current.length} revistas foram carregadas.`:"";
}
function showMore(){
  const next=current.slice(shown,shown+PAGE);
  $("grid").insertAdjacentHTML("beforeend",next.map(cardHtml).join(""));
  shown+=next.length;
  updateStatus();
  if(io&&shown<current.length){io.unobserve($("sentinel"));io.observe($("sentinel"))}
}
const io=window.IntersectionObserver?new IntersectionObserver(es=>{
  if(es[0].isIntersecting&&shown<current.length)showMore();
},{rootMargin:"400px"}):null;
if(io)io.observe($("sentinel"));

/* ---------- Leitor de PDF ---------- */
let lastCard=null;
function openReader(f,card){
  lastCard=card;
  $("rTitle").textContent=f.title;
  $("rMeta").textContent=`${f.country} · ${f.year||"—"} · publicação ${fmt(f.pub)}`;
  const d=$("rDownload");
  if(f.dl){d.href=f.dl;d.setAttribute("download",f.title.replace(/[^\w\-]+/g,"-").toLowerCase()+".pdf");d.hidden=false}
  else{d.removeAttribute("href");d.hidden=true}
  const o=$("rOpen");
  if(f.pdf){o.href=f.pdf;o.hidden=false;$("rFrame").hidden=false;$("rFrame").src=f.pdf;$("rNote").textContent="Se o PDF não aparecer aqui, use “Abrir em nova aba”: alguns sites não permitem exibição dentro de outra página."}
  else{o.hidden=true;$("rFrame").hidden=true;$("rFrame").src="about:blank";$("rNote").textContent="Esta revista ainda não tem um link de PDF no CSV (coluna pdf_url)."}
  $("reader").hidden=false;document.body.style.overflow="hidden";
  $("rClose").focus();
}
function closeReader(){
  $("reader").hidden=true;$("rFrame").src="about:blank";document.body.style.overflow="";
  if(lastCard)lastCard.focus();
}
$("rClose").addEventListener("click",closeReader);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("reader").hidden)closeReader()});
$("grid").addEventListener("click",e=>{
  const c=e.target.closest(".card");if(c)openReader(films[+c.dataset.i],c);
});

/* ---------- Eventos e carga ---------- */
$("q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase();render()});
$("decade").addEventListener("change",e=>{state.decade=e.target.value;render()});
$("country").addEventListener("change",e=>{state.country=e.target.value;render()});
$("sort").addEventListener("change",e=>{state.sort=e.target.value;render()});
$("clear").addEventListener("click",reset);
$("toggle").addEventListener("click",()=>{
  const open=$("filters").classList.toggle("open");
  $("toggle").setAttribute("aria-expanded",open);
  $("toggle").textContent=open?"Ocultar filtros":"Mostrar filtros";
});
/* Endereço do CSV. Troque pelo link do seu arquivo no GitHub, por exemplo:
   https://raw.githubusercontent.com/SEU-USUARIO/SEU-REPOSITORIO/main/revistas.csv
   Também é aceito o link normal (github.com/.../blob/...), que é convertido para raw.
   Para testar outro CSV sem editar o código, use ?csv=ENDERECO na URL da página. */
const CSV_URL="revistas.csv";

function resolveCsvUrl(){
  let u=new URLSearchParams(location.search).get("csv")||CSV_URL;
  const m=u.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/i);
  if(m)u=`https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`;
  return u;
}
const csvUrl=resolveCsvUrl();
fetch(csvUrl,{cache:"no-cache"})
  .then(r=>{if(!r.ok)throw new Error("resposta "+r.status+" ao buscar o CSV");return r.text()})

/* ---------- Banner 728x90 (lido de um CSV) ---------- */
/* Endereço do CSV de banners. Colunas: titulo, iframe_url, data_inicio (opcional), data_validade.
   A imagem e o link do banner ficam dentro da página/iframe indicada em iframe_url (o clique acontece dentro do iframe).
   Troque pelo link raw do seu arquivo no GitHub, ou use ?banners=ENDERECO na URL da página. */
const BANNERS_URL="banners.csv";
const BANNER_MS=10000;
let banners=[],bIdx=0,bShown="";

function ghRaw(u){
  const m=u.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/i);
  return m?`https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}`:u;
}
function nowKey(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
const hasTime=v=>/[T\s]\d{1,2}:\d{2}/.test(v||"");
/* Validade: só data = vale até o fim desse dia; data com hora = vale até essa hora. Vazio = sem prazo. */
function bannerValid(b){
  const now=nowKey();
  if(b.inicio&&now<parseKey(b.inicio))return false;
  if(!b.validade)return true;
  const k=parseKey(b.validade);
  if(!k)return false;
  return hasTime(b.validade)?now<=k:now.slice(0,10)<=k.slice(0,10);
}
function fitBanner(){
  const w=$("bannerBox").clientWidth;
  $("bannerFrame").style.transform=`scale(${w/728})`;
}
function showBanner(){
  const ok=banners.filter(bannerValid);
  if(!ok.length){$("banner").hidden=true;$("bannerFrame").src="about:blank";bShown="";return}
  const b=ok[bIdx%ok.length];bIdx++;
  $("banner").hidden=false;
  if(b.img!==bShown){$("bannerFrame").src=b.img;bShown=b.img}
  $("bannerFrame").title=b.titulo||"Banner";
  fitBanner();
}
/* A célula pode ter só o endereço ou o código <iframe src="...">; usa-se apenas o src. */
function bannerSrc(v){
  const m=(v||"").match(/<iframe[^>]*?\ssrc\s*=\s*["']([^"']+)["']/i);
  return safeUrl(m?m[1]:v);
}
function startBanners(text){
  const rows=parseCSV(text);if(rows.length<2)return;
  const head=rows[0].map(h=>h.trim().toLowerCase());
  banners=rows.slice(1).map(r=>{
    const o={};head.forEach((h,i)=>o[h]=(r[i]||"").trim());
    return{titulo:o.titulo,img:bannerSrc(o.iframe_url||o.imagem_url||""),inicio:o.data_inicio,validade:o.data_validade};
  }).filter(b=>b.img);
  showBanner();
  if(banners.length>1)setInterval(()=>{if(!document.hidden)showBanner()},BANNER_MS);
}
if("ResizeObserver" in window)new ResizeObserver(fitBanner).observe($("bannerBox"));else addEventListener("resize",fitBanner);
fetch(ghRaw(new URLSearchParams(location.search).get("banners")||BANNERS_URL),{cache:"no-cache"})
  .then(r=>{if(!r.ok)throw 0;return r.text()})
  .then(startBanners)
  .catch(()=>{});
</script>
